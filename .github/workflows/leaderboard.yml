name: Q-Day Leaderboard

# Runs every flagship scenario in SQUARE/Configs/, scores CRQC feasibility, and
# publishes a static scoreboard to GitHub Pages. Triggers on push to main, every
# night, and on demand. Any scenario report that fails aborts the build (no stale
# or partial board is ever published).
#
# One-time setup: repository Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: q-day-leaderboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQuaRE
        working-directory: SQUARE
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Fetch previously published leaderboard (best-effort, for history)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          URL="https://${OWNER}.github.io/${REPO}/data.json"
          if curl -fsSL "$URL" -o prev.json; then
            echo "Fetched prior history from $URL"
          else
            echo "No prior leaderboard at $URL (first run?) — starting a fresh history."
            rm -f prev.json
          fi

      - name: Build leaderboard site
        working-directory: SQUARE
        run: |
          python scripts/build_leaderboard.py \
            --configs Configs \
            --out "$GITHUB_WORKSPACE/_site" \
            --prev-data "$GITHUB_WORKSPACE/prev.json" \
            --commit "$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)" \
            --score-doc-url "https://github.com/${{ github.repository }}/blob/main/SQUARE/docs/leaderboard-score.md"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
