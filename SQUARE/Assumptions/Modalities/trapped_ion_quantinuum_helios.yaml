# Physical assumptions for the Quantinuum Helios trapped-ion quantum processor.
# Helios is Quantinuum's 2025 flagship system, featuring >56 fully-connected trapped-ion qubits
# with record-setting two-qubit gate fidelity (>99.9%). Trapped-ion gates are 100-1000x slower
# than superconducting gates — this contrast is the interesting story this modality surfaces.
document_id: trapped_ion_quantinuum_helios
schema_version: 1
primary_reference: >-
  Quantinuum. Helios: Quantinuum's Quantum Charge-Coupled Device (QCCD) trapped-ion processor.
  Quantinuum Technical Specifications and H-Series Benchmarks (2025).
  https://www.quantinuum.com/hardware/helios
date_issued: "2025-04-01"
notes: >
  Quantinuum Helios is the company's next-generation QCCD (Quantum Charge-Coupled Device)
  trapped-ion processor following the H2 series. Helios achieves >99.9% two-qubit gate fidelity
  with all-to-all connectivity, but native two-qubit gate times are in the millisecond regime —
  orders of magnitude slower than superconducting platforms. This makes surface-code cycle times
  dramatically longer, which the SQuaRE naive_serial_time heuristic will surface clearly.
  Values below use Quantinuum's published H2 / Helios benchmark data as primary sources where
  available; OSRE extension parameters are speculative placeholders consistent with the trapped-ion
  literature (Bruzewicz et al. 2019 review, DOI: 10.1063/1.5088164).

characteristic_physical_gate_error_rate:
  value: 0.0008
  unit: "error_probability_per_gate"
  confidence: estimated
  source: "Quantinuum (2025), Helios two-qubit gate fidelity >99.9% (error < 0.1%) — using 8e-4 as conservative estimate; consistent with published H2 benchmarks at 0.08-0.15% 2Q error"
  date: "2025-04-01"
  section: "Device benchmarks"
  notes: >
    Quantinuum H2 achieved median 2Q ZZ-gate error ~0.08% (8e-4). Helios targets further
    improvement; 8e-4 is a conservative placeholder consistent with published H2 performance.
    See: https://www.quantinuum.com/news/quantinuum-h2-sets-new-records
  layer: physical

surface_code_cycle_time:
  value: 1000.0
  unit: "microseconds"
  confidence: low
  source: "SQuaRE placeholder derived from trapped-ion native 2Q gate time ~1-3ms (Quantinuum H-series) + measurement overhead; syndrome extraction cycle O(1ms) = 1000µs"
  date: "2025-04-01"
  section: "SQuaRE placeholder"
  notes: >
    THIS IS THE KEY CONTRAST WITH SUPERCONDUCTING: trapped-ion 2Q gate times are ~1-3 ms
    (1000-3000 µs) vs superconducting ~100 ns. A surface-code syndrome extraction requiring
    multiple gate layers results in a QEC cycle time of O(1 ms), making naive_serial_time
    dramatically longer than for superconducting modalities — this is expected physics.
    Refine from Quantinuum's published compiled syndrome schedules for Helios.

classical_control_reaction_time:
  value: 500.0
  unit: "microseconds"
  confidence: low
  source: "SQuaRE placeholder for trapped-ion classical control latency; Quantinuum QCCD architectures require ion shuttling which adds classical control overhead — O(100-500µs) per reaction"
  date: "2025-04-01"
  section: "SQuaRE placeholder"
  notes: Trapped-ion architectures include ion shuttling delays in addition to classical electronics latency; 500µs is a conservative placeholder.

