# Extended native physical layer (OSRE memo) — trapped-ion coherence times are much longer than superconducting.

coherence_time_t1_microseconds:
  value: 100000000.0
  unit: "microseconds"
  confidence: estimated
  source: "Trapped-ion T1 (hyperfine qubit) is effectively infinite on algorithm timescales; >10^4 s demonstrated in laboratory settings (Bruzewicz et al. 2019, DOI: 10.1063/1.5088164)"
  date: "2025-04-01"
  section: "Device characterisation"
  notes: >
    Trapped-ion hyperfine qubits have T1 times on the order of years in principle; T1 is
    not the dominant decoherence mechanism. Value 1e8 µs (100 seconds) is a practical
    lower bound from published trapped-ion experiments.
  layer: physical

coherence_time_t2_microseconds:
  value: 10000000.0
  unit: "microseconds"
  confidence: estimated
  source: "Quantinuum H2 T2 coherence > seconds demonstrated; Bruzewicz et al. (2019) review reports T2 > 100s for hyperfine ions in well-shielded traps. DOI: 10.1063/1.5088164"
  date: "2025-04-01"
  section: "Device characterisation"
  notes: >
    T2 (Ramsey) coherence for Quantinuum H-series > 1 second. Value 1e7 µs (10 seconds)
    is conservative; the dominant noise source is motional heating and control fluctuations,
    not qubit relaxation.
  layer: physical

