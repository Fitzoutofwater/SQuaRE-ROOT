# Physical assumptions for the IBM Heron r2 (156-qubit, tunable-coupler) superconducting processor.
# IBM's Heron r2 chip is a 156-qubit heavy-hex lattice device with tunable couplers, representing
# IBM's current near-term reference point. Published characterisation data from the 2024 Nature paper
# and IBM Quantum System Two datasheet are used as primary sources.
document_id: superconducting_ibm_heron_r2
schema_version: 1
primary_reference: >-
  IBM Quantum. IBM Quantum System Two with Heron r2 processor: device specifications and performance
  characterization. IBM Research Blog and Quantum Volume benchmarks (2024).
  https://research.ibm.com/blog/ibm-quantum-roadmap-2033
doi: "10.1038/s41586-023-06096-3"
date_issued: "2024-12-01"
notes: >
  IBM Heron r2 is a 156-qubit heavy-hex lattice processor with tunable couplers, introduced as part
  of IBM Quantum System Two. The heavy-hex connectivity limits native 2Q gate connectivity but reduces
  crosstalk and improves median 2Q gate fidelity significantly over earlier Eagle/Falcon generations.
  Cycle time and reaction time values below are SQuaRE placeholders consistent with IBM published
  round-trip latency estimates; refine from device-specific calibration data when available.
  Gate error rates are derived from IBM's median ECR (echoed cross-resonance) gate characterisation.

characteristic_physical_gate_error_rate:
  value: 0.0003
  unit: "error_probability_per_gate"
  confidence: estimated
  source: "IBM Quantum (2024), Heron r2 device characterisation; median 2Q ECR gate error ~3e-4 reported in IBM Quantum Platform calibration data and roadmap publications"
  date: "2024-12-01"
  section: "Device characterisation"
  notes: >
    Median ECR (echoed cross-resonance) 2Q gate error for Heron r2 tunable-coupler architecture.
    IBM reports median ~0.03% (3e-4) for Heron r2, a significant improvement over Eagle r3 (~6e-3).
  layer: physical

surface_code_cycle_time:
  value: 1.0
  unit: "microseconds"
  confidence: low
  source: "SQuaRE placeholder consistent with IBM superconducting gate times; IBM Heron ECR gate ~68ns implies QEC cycle O(1µs) — refine from IBM-specific syndrome extraction schedule"
  date: "2024-12-01"
  section: "SQuaRE placeholder"
  notes: >
    IBM Heron r2 native ECR gate duration is ~68 ns. A full surface-code syndrome extraction cycle
    requires multiple gate layers plus measurement, placing cycle time in the ~0.5–2 µs range.
    Value of 1.0 µs is a conservative placeholder; replace with compiled syndrome schedule.

classical_control_reaction_time:
  value: 10.0
  unit: "microseconds"
  confidence: low
  source: "SQuaRE placeholder; IBM Quantum System Two control electronics latency not publicly pinned for Heron r2 — order-of-magnitude O(10µs) consistent with superconducting control plane literature"
  date: "2024-12-01"
  section: "SQuaRE placeholder"
  notes: Classical feedback latency for Heron r2 with IBM Quantum System Two is not published in detail; use with caution for reaction-limited schedule heuristics.

connectivity_model:
  value: "heavy_hex_tunable_coupler"
  unit: "descriptor"
  confidence: estimated
  source: "IBM Quantum (2024), Heron r2 architecture overview; heavy-hex lattice with tunable couplers to suppress ZZ crosstalk"
  date: "2024-12-01"
  section: "Architecture overview"
  notes: Heavy-hex connectivity has lower qubit degree than square-lattice; SWAP overhead for non-adjacent operations must be accounted for in routing.
  layer: physical

platform_class:
  value: "superconducting_heavy_hex_tunable_coupler_heron_r2"
  unit: "descriptor"
  confidence: estimated
  source: "IBM Quantum (2024), Heron r2 product documentation"
  date: "2024-12-01"
  section: "Device overview"
  layer: physical

