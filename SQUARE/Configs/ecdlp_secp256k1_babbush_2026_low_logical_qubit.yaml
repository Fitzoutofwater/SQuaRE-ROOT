# ECDLP secp256k1 (256-bit) using Babbush et al. (2026) low–logical-qubit headline envelope + Babbush superconducting baseline.
schema_version: 1
scenario: ecdlp_secp256k1_babbush_2026_low_logical_qubit
description: >-
  Logical resources: ≤1200 logical qubits and ≤90M Toffoli gates (low_logical_qubit_variant). Same modality/QEC/magic
  stack as the low-Toffoli scenario; envelope trades fewer logical qubits for a higher Toffoli budget (abstract).
  Modality timings: G&E 2021 Table 2 interim cross-reference (see modality YAML).

target:
  problem: ecdlp_secp256k1_256_bit
  curve_bit_length: 256
  ecdlp_variant: low_logical_qubit_variant

qec:
  distance_policy: heuristic_union_bound
  logical_error_budget: 0.1

paths:
  modality: Assumptions/Modalities/superconducting_babbush_et_al_2026.yaml
  qec_code: Assumptions/QEC_Codes/surface_gidney_ekera_2021.yaml
  magic: Assumptions/MagicStateProduction/ccz_factory_gidney_ekera_2021.yaml
  magic_aux: Assumptions/MagicStateProduction/t_factory_fallback_gidney_ekera_2021.yaml
  algorithm: Algorithms/ecdlp_secp256k1_babbush_et_al_2026.yaml
