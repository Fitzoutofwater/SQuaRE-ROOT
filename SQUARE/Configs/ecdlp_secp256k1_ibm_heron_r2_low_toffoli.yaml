# ECDLP secp256k1 (256-bit) using IBM Heron r2 superconducting baseline + Babbush et al. (2026) low-Toffoli algorithm envelope.
# Demonstrates how Heron r2's improved gate fidelity (~3e-4) impacts physical qubit overhead vs earlier superconducting baselines.
schema_version: 1
scenario: ecdlp_secp256k1_ibm_heron_r2_low_toffoli
description: >-
  ECDLP secp256k1 (256-bit) paired with the IBM Heron r2 superconducting modality (156-qubit,
  tunable-coupler, median 2Q ECR error ~3e-4) and the Babbush et al. (2026) low-Toffoli algorithm
  envelope (≤1450 logical qubits, ≤70M Toffoli gates). Demonstrates the physical qubit footprint
  achievable with IBM's current flagship near-term processor assuming surface-code QEC.
  Identity QCVV/QEM (σ=s=Γ=1) for baseline comparison.

target:
  problem: ecdlp_secp256k1_256_bit
  curve_bit_length: 256
  ecdlp_variant: low_toffoli_variant

qec:
  distance_policy: heuristic_union_bound
  logical_error_budget: 0.1

paths:
  modality: Assumptions/Modalities/superconducting_ibm_heron_r2.yaml
  qec_code: Assumptions/QEC_Codes/surface_gidney_ekera_2021.yaml
  magic: Assumptions/MagicStateProduction/ccz_factory_gidney_ekera_2021.yaml
  magic_aux: Assumptions/MagicStateProduction/t_factory_fallback_gidney_ekera_2021.yaml
  algorithm: Algorithms/ecdlp_secp256k1_babbush_et_al_2026.yaml
  qcvv: Assumptions/QCVV/identity_no_overhead.yaml
  qem: Assumptions/QEM/identity_no_overhead.yaml
